# docs/.docs-policy.yml — このリポジトリのドキュメント規約
#
# docs-keeper が読む。手で直してよい。
# 書式は YAML の一部だけ(コメント / key: value / 入れ子 / '- ' リスト /
# インラインリスト [a, b])。アンカーや複数行文字列は使えない。

version: 1

# 索引。すべての md はここから辿れること。
index: docs/README.md

# 置き場所と役割。ここに無い場所へ新しい md を作ろうとすると差し戻される。
# 実在する場所だけ書く。
layout:
  - path: README.md
    role: 作品としての紹介。外から来た人が最初に見る
  - path: CLAUDE.md
    role: 開発の決まりごとと既知の罠。作業前に読む
  - path: docs/README.md
    role: 索引。どれを読むか
  - path: docs/spec.md
    role: いまの仕様。やらないと決めたことも書く
  - path: docs/architecture.md
    role: どう作ってあるか。設計判断とその理由
  - path: docs/TODO.md
    role: 残作業だけ。済んだものは archive へ
  - path: docs/changelog.md
    role: 利用者から見た変更点
  - path: docs/release/
    role: 出すときの手順・掲載文・審査情報
  - path: docs/archive/
    role: 記録。いまの仕様として読まない

# 行数の上限。超えたら停止時に指摘し、compact が archive 送りを提案する。
# 現状の 1.2 倍くらいから始める。archive は記録なので大きく取る。
limits:
  docs/TODO.md: 120
  docs/spec.md: 200
  docs/architecture.md: 250
  docs/README.md: 150
  CLAUDE.md: 300
  README.md: 150
  docs/archive/**: 2000
  default: 400

# 「ここを触ったら、ここを直す」の対応表。
# セッション中に source を変えたのに docs が動いていなければ、停止時に指摘する。
# 疑わしいものを足さない。2〜3 本から始める。
watch:
  - source: []
    docs: []
    why: ""

# 記録の扱い。
archive:
  dir: docs/archive/
  index: docs/archive/README.md   # 記録の索引。無いと 1000 行を grep することになる

  # 割り方。記録は「短く保つ」のではなく「引けるようにする」のが目的。
  #   by: year    … archive/2026-H1.md のように期間で割る(既定向き)
  #   by: version … archive/v1.0.md のように版で割る(リリースのあるもの向き)
  #   by: none    … 割らない
  rotate:
    by: year
    max_lines: 1500   # 1 ファイルがこれを超えたら「割りどき」と言う

  rules:
    - 実装履歴・試したこと・没案は archive/ にだけ書く。仕様書と設計書には書かない
    - TODO.md の済んだ項目は archive/work-log.md へ移す
    - archive の各項目には日付を付ける。日付のない記録は後から捨てられない
    - 割ったら archive の索引に 1 行足す。索引に無い記録は無いのと同じ

# 停止時の指摘。
notify:
  enabled: true
  min_source_edits: 1   # source を何件触ったら指摘するか

# 新規 md の置き場所チェック。
guard:
  enabled: true
  scope: ["docs/**", "*.md"]   # 見張る範囲。アプリのソース内 README は外す
  extensions: [".md"]          # 見張る拡張子。notebook も見るなら ".ipynb" を足す
  allow: []                    # layout 以外に許す場所があれば
