# .code-policy.yml — このリポジトリのコード規約(機能で分ける形)
#
# 向き: 画面のあるアプリ(React / Next.js / Flutter / Vue)。
#       層より先に「機能」で切り、機能どうしを混ぜないことを守る。
#
# この形の肝は isolate。features/cart が features/order を直接呼び始めた瞬間に
# 機能の境目が消える。共有したくなったら shared へ上げる、と決めておく。

version: 1

scope:
  include: ["src/**", "lib/**", "app/**"]
  exclude:
    - "**/*.test.*"
    - "**/*.stories.*"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated/**"
    - "**/*.d.ts"

layers:
  - name: features
    path: ["src/features/**", "lib/features/**"]
    role: 機能ひとまとまり。画面・状態・その機能だけの API
    allow: [entities, shared]
    isolate: 3               # 先頭 3 セグメント (src/features/cart) が違えば依存禁止

  - name: entities
    path: ["src/entities/**", "lib/models/**", "src/domain/**"]
    role: 業務の型と規則。画面を知らない
    allow: [shared]

  - name: shared
    path: ["src/shared/**", "src/components/**", "src/lib/**", "lib/shared/**"]
    role: どの機能からも使う部品。機能の名前を持ち込まない
    allow: []

  - name: pages
    path: ["src/pages/**", "src/app/**", "src/routes/**"]
    role: 入口。features を並べるだけ
    allow: [features, entities, shared]

limits:
  file_lines:
    default: 250
    "**/components/**": 200  # 画面部品が 200 行を超えたら、たいてい 2 つ入っている
  function_lines: 50
  nesting: 4
  params: 5
  dir_files: 20

comments:
  min_ratio: 0.02            # 画面のコードは自明なものが多い。下限はゆるく
  max_ratio: 0.3
  max_block: 12
  require_for_lines: 40

duplication:
  min_lines: 8
  ignore: ["**/*.test.*", "**/*.stories.*"]

  # 画面の部品はここが効く。ボタンやカードの「同じ骨組みで文言だけ違う」は
  # 行の一致では見つからない。ただし枠組みが書けと言っている形 (build /
  # コンポーネント本体) が大量に一致するので、max_group で切る。
  similar: 0.85
  similar_min_lines: 8
  similar_max_group: 8

dead:
  # 枠組みがファイル名で拾うものは、参照が無くて当たり前。ここに書く。
  entrypoints:
    - "src/pages/**"
    - "src/app/**"
    - "src/routes/**"
    - "**/main.*"
    - "**/index.*"
  ignore: ["**/*.test.*", "**/*.stories.*"]
  symbols: true

notify:
  enabled: true

guard:
  enabled: true
  extensions: []
  allow: []
