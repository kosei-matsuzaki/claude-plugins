# .claude/policy.yml — このリポジトリの規約 (道具・ライブラリ向け)
#
# 誰が読むか: /crew-keeper:check /standup /refresh と、置いた役 (agent)。
# 手で直してよい。役を消したら .claude/agents/ の該当ファイルも消す。

version: 1

project:
  name: {{リポジトリ名}}
  kind: tool                  # product / tool / library / research
  what: {{一行で、何をするものか}}
  users: {{誰が使うか。自分だけなら「自分」と書く}}
  revenue: none               # none / unknown / ads / subscription / paid / sponsor / contract
  stage: running              # prototype / running / maintained

# 役。why が書けない役は置かない (呼ばれずに残るだけ)
roles:
  - name: docs-auditor
    why: 実装を変えたとき docs を直し忘れる。書いた本人には食い違いが見えない
    stance: このリポジトリを初めて読む人
    reads: ["README.md", "docs/**", "CLAUDE.md"]
  - name: duplication-auditor
    why: 同じ事実が CLAUDE.md と docs の両方に書かれ、片方だけ古くなる。書いた本人には見えない
    stance: この 3 か月このリポジトリを触っていない人。どれが正か覚えていない
    reads: ["README.md", "CLAUDE.md", "docs/**"]

  - name: code-steward
    why: 順に足したコードが伸びて散る。scripts/ と使い捨ての実験が溜まる
    stance: 半年後にこれを引き継ぐ人
    reads: ["{{ソースの根}}/**"]

  - name: critic
    why: 作った本人しかいないので、機能の筋を疑う人がいない
    stance: {{この道具を使う立場。「同じ問題を別の道具で解いている人」など}}
    reads: ["README.md", "docs/**"]

  - name: reviewer
    why: 差分を読まないままコミットが積み上がる
    stance: 通しで差分を読む人
    reads: []

# 生成するもの。keep に書いたものは作り直しで触らない
generate:
  claude_md: CLAUDE.md
  keep: []


# 定期で走らせるもの。登録は生成される /routine → skill schedule が行う
routines: []


notify:
  enabled: true
  drift: true                 # 土台が変わったらセッションの頭で言う

judgments:
  regrow: 0.3                 # 「いまは直さない」から 3 割伸びたら言い直す

# ------------------------------------------------------------------ docs
# 文書の置き場所・索引・行数・実装との対応。
docs:

  # 索引。すべての md はここから辿れること。
  index: docs/README.md

  # 置き場所と役割。ここに無い場所へ新しい md を作ろうとすると差し戻される。
  # 実在する場所だけ書く。
  layout:
    - path: README.md
      role: 作品としての紹介。外から来た人が最初に見る
    - path: CLAUDE.md
      role: 開発の決まりごとと既知の罠。作業前に読む
    - path: docs/README.md
      role: 索引。どれを読むか
    - path: docs/spec.md
      role: いまの仕様。やらないと決めたことも書く
    - path: docs/architecture.md
      role: どう作ってあるか。設計判断とその理由
    - path: docs/TODO.md
      role: 残作業だけ。済んだものは archive へ
    - path: docs/changelog.md
      role: 利用者から見た変更点
    - path: docs/release/
      role: 出すときの手順・掲載文・審査情報
    - path: docs/archive/
      role: 記録。いまの仕様として読まない

  # 行数の上限。超えたら停止時に指摘し、compact が archive 送りを提案する。
  # 現状の 1.2 倍くらいから始める。archive は記録なので大きく取る。
  limits:
    docs/TODO.md: 120
    docs/spec.md: 200
    docs/architecture.md: 250
    docs/README.md: 150
    CLAUDE.md: 300
    README.md: 150
    docs/archive/**: 2000
    default: 400

  # CLAUDE.md は毎セッション全文が読まれる。**全体の行数だけでは足りない。**
  # 上限の内側のまま、1 つの節が設計書に育っていることがある。節ごとに見る。
  claude_md:
    path: CLAUDE.md
    max_section_lines: 25   # これを超える節は docs へ出して 1 行で指す候補

  # 同じ話が複数の文書に散っていないか。見出しの重なりで見る。
  # 同じ話かどうかは読まないと決まらないので、機械は場所を並べるだけ。
  overlap:
    enabled: true
    scope: ["*.md", "docs/*.md"]   # 記録 (archive) と入れ子の docs は外す
    ignore: []                     # 重なってよい見出し (「動かす」など) を足す
    min_docs: 2                    # 何か所に出たら言うか

  # 同じ文が複数の文書に書かれていないか (二重管理)。字面がそろっているものだけ。
  # 言い換えて写したものは機械に見えない。それを見るのは役 duplication-auditor。
  duplication:
    enabled: true
    min_lines: 3                   # 実質のある行が何行そろったら言うか
    min_chars: 80                  # そのかたまりの文字数がこれ未満なら数えない
    scope: ["*.md", "docs/**"]     # 記録 (archive) は自動で外れる
    ignore: []                     # 写しがあって正しい文書があれば

  # 正典に開発の履歴が混ざっていないか。日付・「以前は」・「〜に変更した」を拾う。
  # **/docs の既定は「実装に合わせる」= 追記なので、変更のたびに経緯が仕様書へ
  # 流れ込む。**1 回ごとは小さいので誰も止めず、溜まると仕様書として死ぬ。
  # 行数の上限では捕まらない (履歴混じりの 180 行は上限 200 行を通る)。
  history:
    enabled: true
    scope: ["*.md", "docs/**"]     # 記録 (archive) は自動で外れる
    allow:                         # 履歴を書くのが仕事の文書。ここは見ない
      - docs/changelog.md
      - docs/TODO.md               # 残作業。日付は期限であって履歴ではない

  # 「ここを触ったら、ここを直す」の対応表。
  # セッション中に source を変えたのに docs が動いていなければ、停止時に指摘する。
  # 疑わしいものを足さない。2〜3 本から始める。
  watch:
    - source: []
      docs: []
      why: ""

  # 記録の扱い。
  archive:
    dir: docs/archive/
    index: docs/archive/README.md   # 記録の索引。無いと 1000 行を grep することになる
    # 割り方。記録は「短く保つ」のではなく「引けるようにする」のが目的。
    #   by: year    … archive/2026-H1.md のように期間で割る(既定向き)
    #   by: version … archive/v1.0.md のように版で割る(リリースのあるもの向き)
    #   by: none    … 割らない
    rotate:
      by: year
      max_lines: 1500   # 1 ファイルがこれを超えたら「割りどき」と言う
    rules:
      - 実装履歴・試したこと・没案は archive/ にだけ書く。仕様書と設計書には書かない
      - TODO.md の済んだ項目は archive/work-log.md へ移す
      - archive の各項目には日付を付ける。日付のない記録は後から捨てられない
      - 割ったら archive の索引に 1 行足す。索引に無い記録は無いのと同じ

  # 新規 md の置き場所チェック。
  guard:
    enabled: true
    scope: ["docs/**", "*.md"]   # 見張る範囲。アプリのソース内 README は外す
    extensions: [".md"]          # 見張る拡張子。notebook も見るなら ".ipynb" を足す
    allow: []                    # layout 以外に許す場所があれば

# ------------------------------------------------------------------ code
# 層と依存の向き・長さの上限・重複と使われていないコードの見つけかた。
code:

  # 見る範囲。include が空なら、リポジトリ全体の対応拡張子を見る。
  scope:
    include: ["src/**", "app/**"]
    exclude:
      - "**/*.test.*"
      - "**/*.spec.*"
      - "**/*_test.*"
      - "**/generated/**"
      - "**/*.g.*"
      - "**/migrations/**"

  # 層と、依存してよい向き。
  #   path   … その層に属するファイル(glob)
  #   allow  … その層が import してよい層。ここに無い層へ向かうと逸脱として出る
  #   role   … 一言。差し戻すときに表示される
  # 上に書いた層ほど内側(何にも依存しない)にしておくと読みやすい。
  layers:
    - name: domain
      path: ["src/domain/**"]
      role: 業務の規則。枠組みも DB も知らない
      allow: []
    - name: application
      path: ["src/application/**", "src/usecase/**"]
      role: 手順。domain を組み合わせて 1 つの仕事にする
      allow: [domain]
    - name: infrastructure
      path: ["src/infra/**", "src/adapters/**"]
      role: 外の世界。DB・HTTP・ファイル・SDK
      allow: [domain, application]
    - name: interface
      path: ["src/api/**", "src/cli/**", "src/web/**"]
      role: 入口。受け取って application に渡すだけ
      allow: [domain, application]
    - name: shared
      path: ["src/shared/**", "src/lib/**"]
      role: どの層からも使う道具。業務の言葉を持ち込まない
      allow: []





  # 長さの上限。超えたら停止時に指摘し、split が分けかたを提案する。
  # いまの実物を測って、その 1.2 倍くらいから始める。最初から理想値にしない。
  limits:
    file_lines:
      default: 300
      "src/api/**": 200        # 入口は薄いはず。厚いなら application へ移すとき
    function_lines: 50
    nesting: 4                 # 字下げの段数。関数の本体を 1 段と数える
    params: 5
    dir_files: 15              # 1 ディレクトリのファイル数。超えたら分けかたが無い印

  # コメント。多すぎても少なすぎても指摘する。
  comments:
    min_ratio: 0.03            # コメント行 / コード行。下回ると「なぜ」が残っていない
    max_ratio: 0.35            # 上回るとコードの言い換えが混じっている
    max_block: 15              # 連続コメントの上限。長い説明は docs へ
    require_for_lines: 40      # これより長い関数には説明を 1 つ求める

  # 重なっているコードの見つけ方。
  duplication:
    min_lines: 8               # 行がそのまま重なっているとき、何行そろったら言うか
    ignore: ["**/*.test.*", "**/fixtures/**"]
    # 行はそろわないが形が同じもの (共通化できるものの多くはこちら)。
    # 骨組みの重なり具合。0.85 で「小さいほうの 85% が相手にもある」。
    # 下げると似ていないものまで出る。0 にすると見ない。
    similar: 0.85
    similar_min_lines: 8       # これより短い関数は見ない
    similar_max_group: 12      # これより大きいかたまりは枠組みの書き方とみなして捨てる


  # 使われていないものの見つけ方。
  dead:
    entrypoints: ["src/main.*", "src/index.*", "src/cli/**"]   # ここは参照が無くてよい
    ignore: ["**/*.test.*"]
    symbols: true              # 定義だけで呼ばれていない名前も出す(候補どまり)

  # 新規ファイルの置き場所チェック。層のどこにも入らない場所は差し戻す。
  guard:
    enabled: true
    extensions: []             # 空なら scope の対応拡張子ぜんぶ
    allow: []                  # 層の外に置いてよい場所があれば
