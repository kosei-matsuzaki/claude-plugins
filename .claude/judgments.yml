# 判断台帳。「いまは直さない」と決めたものを覚えておく。
#
# 消せばまた指摘される。判断が変わったら消すか、why を書き直す。
# until を書くと、その日を過ぎたときにもう一度言う。運営の判断はたいてい期限付き。

judgments:
