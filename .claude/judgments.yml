    why: "stamp の実行ブロック。手順の中でそのまま動かすコマンドなので指しに行かせると手順が切れる。片方を直したらもう片方も直す"
    until: 2027-03-01
    date: 2026-09-04
    by: "/claude-keeper:check"
  - key: "similar:code_sections:2"
    path: claude-keeper/scripts/k.py
    decision: "まとめない"
    why: "docs と code で呼ぶ検査の関数が違い、引数の形もそろわない。共通化には関数表を渡す遠回りが要る。形が同じだけで別物"
    at: 2
    date: 2026-09-04
    by: "統合のとき"
  - key: "similar:layers:2"
    path: claude-keeper/scripts/policy.py
    decision: "まとめない"
    why: "どちらも「マップの一覧を均す」形だが、埋める欄も欠けたときの扱いも違う。抽象化すると両方読みにくくなる"
    at: 2
    date: 2026-09-04
    by: "統合のとき"
  - key: "dup:claude-keeper/skills/policy/SKILL.md|claude-keeper/templates/commands/docs.md"
